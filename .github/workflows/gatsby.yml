name: Deploy Gatsby to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/configure-pages@v5

      - name: Organize storefront files
        shell: bash
        run: |
          store=static/store
          if ! grep -qi 'id="shopGrid"' "$store/index.html"; then
            echo "Upload the main Scruffy Butt index.html from the ZIP to static/store/index.html."
            exit 1
          fi

          mkdir -p "$store"/{books,covers,affiliates}
          shopt -s nullglob

          for file in *.html; do
            case "$file" in
              index.html) ;;
              book-[0-9]*.html) cp "$file" "$store/books/" ;;
              *) cp "$file" "$store/" ;;
            esac
          done

          for file in book-[0-9]*.webp; do
            cp "$file" "$store/covers/"
          done

          for file in styles.css logo.png IMG_3822.jpeg paypal-donation.png \
              script.js showcase.js payment-config.js affiliate-referral.js; do
            if [[ -f "$file" ]]; then
              cp "$file" "$store/"
            fi
          done

          if grep -qi 'The Pink Collar Affiliate Portal' index.html; then
            cp index.html "$store/affiliates/index.html"
          fi

          if [[ -f portal.js ]]; then
            cp portal.js "$store/affiliates/"
          fi

          if [[ ! -f gatsby-config.js && ! -f gatsby-config.ts && ! -f gatsby-config.mjs ]]; then
            printf '%s\n' 'module.exports = { pathPrefix: "/Scruffy2.0" };' > gatsby-config.js
          fi
          
     - name: Restore book pages and covers
        run: |
          mkdir -p static/store
          unzip -oq "new improv scruffy.zip" \
            'books/book-*.html' 'covers/book-*.webp' \
           -d static/store

      - name: Install dependencies
        run: npm install

      - name: Build Gatsby site
        run: npm run build

      - name: Use storefront as homepage if Gatsby has no homepage
        run: |
          if [[ ! -f public/index.html ]]; then
            cp -a public/store/. public/
          fi

      - uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

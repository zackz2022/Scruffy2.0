name: Deploy Gatsby to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/configure-pages@v5

      - name: Restore storefront and book pages
        shell: bash
        run: |
          archive="new improv scruffy.zip"
          if [[ ! -f "$archive" ]]; then
            archive="New-ImprovedScruffyButt-Pages.zip"
          fi
          if [[ ! -f "$archive" ]]; then
            echo "The storefront ZIP is missing from the main repository file list."
            exit 1
          fi

          store=static/store
          mkdir -p "$store"

          unzip -on "$archive" \
            '*.html' 'covers/book-*.webp' \
            'styles.css' 'logo.png' 'IMG_3822.jpeg' 'paypal-donation.png' \
            'script.js' 'showcase.js' 'payment-config.js' \
            'affiliate-referral.js' 'affiliates/portal.js' \
            -d "$store"

          for file in styles.css script.js payment-config.js; do
            if [[ -f "$file" ]]; then
              cp "$file" "$store/$file"
            fi
          done

          if [[ ! -f gatsby-config.js && ! -f gatsby-config.ts && ! -f gatsby-config.mjs ]]; then
            printf '%s\n' 'module.exports = { pathPrefix: "/Scruffy2.0" };' > gatsby-config.js
          fi

      - name: Install dependencies
        run: npm install

      - name: Build Gatsby site
        run: npm run build

      - name: Publish books at both catalog paths
        shell: bash
        run: |
          for id in $(seq 1 56); do
            test -s "public/store/books/book-$id.html"
            test -s "public/store/covers/book-$id.webp"
          done

          if [[ ! -f public/index.html ]]; then
            cp -a public/store/. public/
          else
            mkdir -p public/books public/covers
            cp -a public/store/books/. public/books/
            cp -a public/store/covers/. public/covers/
          fi

      - uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
